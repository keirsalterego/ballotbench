# Build the mdBook in docs/ and publish it to GitHub Pages.
# The book includes the top-level JUDGING, ARCHITECTURE, DATA-MODEL and NOTES
# files, so a change to any of them rebuilds it too.
name: book

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "JUDGING.md"
      - "ARCHITECTURE.md"
      - "DATA-MODEL.md"
      - "NOTES.md"
      - ".github/workflows/book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Build
        run: mdbook build docs
      - name: Every include resolved
        run: "! grep -rl '{{#include' docs/book --include='*.html'"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
