{% extends "portal/base.html" %}
{% block title %}Reset your password{% endblock %}
{% block content %}
<h1>Reset your password</h1>
<p>Enter the email address you signed up with. If it has an account, a link to choose a new password goes to that inbox.</p>
<form method="post" class="stack">{% csrf_token %}
  <label>Email {{ form.email }} {{ form.email.errors }}</label>
  <button>Send the link</button>
</form>
{% endblock %}
