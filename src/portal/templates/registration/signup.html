{% extends "portal/base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h1>Sign up</h1>
<form method="post" class="stack">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}<label>{{ field.label }} {{ field }} {{ field.errors }}</label>{% endfor %}
  <button>Create account</button>
</form>
{% endblock %}
